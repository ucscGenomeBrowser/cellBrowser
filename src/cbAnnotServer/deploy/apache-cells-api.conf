# Apache reverse-proxy snippet for the Cell Browser login / annotation API.
#
# Add these lines inside the cells VirtualHost blocks in
# /usr/local/apache/conf.d/vhosts.conf (cells.ucsc.edu, cells-beta and
# cells-test.gi.ucsc.edu). Apache forwards every /api request to the local
# gunicorn process (deploy/run-gunicorn.sh); everything else is still served as
# static files from the docroot.
#
# Requires mod_proxy and mod_proxy_http. These were already loaded for the old
# dataset-search proxy (see the removal note below), so no module change is needed.
#
# The target host:port must match CBANNOT_BIND in gunicorn.conf.py / the systemd
# unit (default 127.0.0.1:5051). Use a different port per vhost if beta and
# production run separate backends on the same host.
#
# FIRST, remove the dead dataset-search proxy. The cells-test vhost still has:
#     ProxyPass        /api/search http://127.0.0.1:3001/search
#     ProxyPassReverse /api/search http://127.0.0.1:3001/search
# That prototype backend is retired -- the port 3001 service is gone and nothing
# in the frontend (source or deployed docroots) calls /api/search. Delete both
# lines. Doing so also avoids a ProxyPass ordering trap: a bare /api placed
# before a more specific /api/search would shadow it, since Apache matches
# ProxyPass in config order. With the search lines gone, the /api proxy below
# can be added cleanly with no ordering constraint.
#
# After editing vhosts.conf:
#   sudo apachectl configtest && sudo apachectl graceful

# Do not treat /api as a static path.
ProxyPass        /api  http://127.0.0.1:5051/api
ProxyPassReverse /api  http://127.0.0.1:5051/api

# Pass the original Host through; harmless here and useful if the app ever needs it.
ProxyPreserveHost On
